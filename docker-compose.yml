# Development stack.
#   Infrastructure only (run backend/frontend on the host):   docker compose up -d
#   Everything in containers:                                 docker compose --profile app up -d --build
# All published ports are bound to 127.0.0.1; nothing is exposed to the network.
name: nvr-central

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nvr_central}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run python scripts/init-env.py first}
      POSTGRES_DB: ${POSTGRES_DB:-nvr_central}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Live-view gateway: pulls camera RTSP on demand, converts H.265 to H.264 when needed, serves HLS to the backend.
  # Ports are published to this machine only; browsers never connect here (the backend proxies after authorising).
  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    restart: unless-stopped
    volumes:
      - ./streaming/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "127.0.0.1:9997:9997" # API (development: backend on the host)
      - "127.0.0.1:8888:8888" # HLS (development: backend on the host)

  backend:
    profiles: ["app"]
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nvr_central}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nvr_central}
      REDIS_URL: redis://redis:6379/0
      MEDIAMTX_API_URL: http://mediamtx:9997
      MEDIAMTX_HLS_URL: http://mediamtx:8888
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Background worker: connection tests, camera discovery and tunnel health (default queue).
  worker:
    profiles: ["app"]
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nvr_central}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nvr_central}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4 -Q celery

  # Backup worker: its own queue, so a download that runs for hours never delays NVR checks. Recordings are staged
  # in /staging before upload (point BACKUP_STAGING_DIR there; the volume must have room for one recording per job).
  backup-worker:
    profiles: ["app"]
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nvr_central}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nvr_central}
      REDIS_URL: redis://redis:6379/0
      BACKUP_STAGING_DIR: /staging
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backup_staging:/staging
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2 -Q backups

  # Scheduler: periodic NVR health checks and tunnel health collection.
  beat:
    profiles: ["app"]
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nvr_central}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nvr_central}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule

  frontend:
    profiles: ["app"]
    image: node:22-alpine
    working_dir: /app
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  backup_staging:
  frontend_node_modules:
