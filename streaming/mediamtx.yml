# MediaMTX for NVR Central live viewing. Camera paths are created and removed at runtime by the backend through the
# API (see backend/app/streaming), so nothing about cameras or credentials is written in this file.
#
# SECURITY: this server has no user accounts. It is reachable only by the backend (and by FFmpeg running inside this
# container). Never publish ports 9997 or 8888 beyond 127.0.0.1, and never expose them to the internet. Browsers
# never talk to MediaMTX: the backend proxies HLS after checking the user's session and campus access.
logLevel: info

api: true
apiAddress: :9997

rtsp: true
rtspAddress: :8554
rtspTransports: [tcp]

hls: true
hlsAddress: :8888
# Low-latency HLS: the NVR sends a keyframe every ~2 s, so plain segments are 2 s long and players sit 3 of them
# behind (6 s+). Parts let the player fetch each half second as soon as it exists.
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 500ms
hlsAlwaysRemux: false
hlsMuxerCloseAfter: 10s
hlsAllowOrigins: []

authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback
      - action: api

paths: {}
